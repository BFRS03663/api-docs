version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - revive
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G104 # handled by errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shiprocket/apidocs

run:
  timeout: 3m
